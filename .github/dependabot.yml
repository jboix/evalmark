# Weekly updates of the pinned actions and the npm dependencies (Dependabot reads pnpm-lock.yaml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
