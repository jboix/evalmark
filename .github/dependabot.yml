# Weekly updates of the pinned actions and the npm dependencies (Dependabot reads pnpm-lock.yaml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node version in .nvmrc, which is the one the action runs on
      # (`using: node24`). Move it by hand when the runtime moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
