# Publishes the demo to GitHub Pages from the gh-pages branch, on every push to main: the
# dashboard on a synthetic history at the site's root, so people see what they get, and the
# result format's JSON Schemas under schema/, at the address their `$id` gives.
#
# Pages must serve the gh-pages branch (Settings, Pages, "Deploy from a branch").
name: GitHub Page

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-page
  cancel-in-progress: false

permissions: {}

jobs:
  github-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes the gh-pages branch
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the dashboard and record the demo history
        run: |
          pnpm run build
          node dist/cli.js demo --no-serve --dir page
          cp -R schema page/schema
          touch page/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # releases/v4
        with:
          branch: gh-pages
          folder: page
          force: false
          token: ${{ secrets.GITHUB_TOKEN }}
