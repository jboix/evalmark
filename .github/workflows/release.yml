# Cuts a release once Quality passes on main, with semantic-release:
#
#   - it reads the Conventional Commits since the last vX.Y.Z tag: `fix` cuts a patch, `feat` a
#     minor, a `BREAKING CHANGE:` footer a major, anything else nothing;
#   - it publishes the package `evalmark` to npm at that version, with the committed dist/, through
#     npm trusted publishing (OIDC, no token) with provenance;
#   - it commits the version in package.json as `chore(release): X.Y.Z [skip ci]`, tags that
#     commit vX.Y.Z and creates the GitHub Release with its notes. GitHub runs the action from the
#     tagged commit's committed dist/, which Quality has just checked against the sources;
#   - it moves the major tag (v1) to the release, so `uses: jboix/evalmark@v1` follows it.
#
# It runs after Quality rather than on the push itself, so a commit that fails a check is never
# released, and it builds nothing: npm gets the dist/ Quality checked. The main branch's ruleset
# lets only the release bot (a GitHub App) push without a pull request, so the job mints the
# App's token for the release commit, the tags and the GitHub Release; the workflow's own token
# only reads. Checkout keeps no credentials: semantic-release and the major tag script push with
# the token in their environment.
#
# The job runs in the `release` environment, which deploys from main only, and npm's trusted
# publisher for `evalmark` names this repository, this workflow and that environment: no other job
# can publish the package.
name: Release

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read # the App's token writes, not this one
      id-token: write # npm trusted publishing, with provenance
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # The version is pinned: zizmor's ad-hoc package audit has nothing left to check.
      - name: Update npm (trusted publishing needs npm 11.5.1 or later)
        run: npm install -g npm@11.21.0 # zizmor: ignore[adhoc-packages]

      # semantic-release and its plugins are dev dependencies, so the release runs the versions in
      # pnpm-lock.yaml. No lifecycle script runs.
      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Mint the release bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # The git plugin commits package.json with the version first; then the exec plugin removes
      # the `prepare` script (husky, for contributors) from the copy npm publishes, so installing
      # the package runs no script.
      - name: Semantic Release (version commit, npm, tags, GitHub Release)
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: pnpm exec semantic-release
